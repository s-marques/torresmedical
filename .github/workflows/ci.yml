name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Banco de teste para os e2e (as migrations rodam antes dos testes).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: torres
          POSTGRES_PASSWORD: torres
          POSTGRES_DB: torres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torres -d torres_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://torres:torres@localhost:5432/torres_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations no banco de teste
        run: pnpm --filter @torres/api db:deploy

      - name: Testes (com cobertura)
        run: pnpm test:cov

      - name: Publicar cobertura para o Sonar
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/api/coverage/lcov.info
            apps/web/coverage/lcov.info
            packages/shared/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: pnpm build

  sonar:
    name: SonarQube Cloud
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PRs de forks não recebem o SONAR_TOKEN.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo para o Sonar identificar o código novo.
          fetch-depth: 0

      - name: Baixar cobertura
        uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Análise e Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Falha o check quando o Quality Gate reprova.
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
