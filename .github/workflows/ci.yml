name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacao:
    name: Lint, typecheck, testes do shared e build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes do shared (com cobertura)
        run: pnpm --filter @torres/shared test:cov

      - name: Publicar cobertura para o Sonar
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-shared
          path: packages/shared/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: pnpm build

  # Os testes da api e do web rodam em partes paralelas (--shard), cada uma num runner próprio.
  # Ao mudar o número de partes, atualize sonar.javascript.lcov.reportPaths no sonar-project.properties.
  testes-api:
    name: Testes da api (parte ${{ matrix.parte }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]

    services:
      # Banco de teste para os e2e (as migrations rodam antes dos testes). Cada parte tem o seu.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: torres
          POSTGRES_PASSWORD: torres
          POSTGRES_DB: torres_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torres -d torres_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # RabbitMQ dos e2e da mensageria.
      rabbitmq:
        image: rabbitmq:4-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: torres
          RABBITMQ_DEFAULT_PASS: torres
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    env:
      DATABASE_URL: postgresql://torres:torres@localhost:5432/torres_test
      RABBITMQ_URL: amqp://torres:torres@localhost:5672
      # Storage dos e2e: MinIO (S3), iniciado no passo abaixo.
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: http://localhost:9000
      STORAGE_S3_BUCKET: torres-arquivos-test
      STORAGE_S3_ACCESS_KEY: torres
      STORAGE_S3_SECRET_KEY: torres-minio

    steps:
      - uses: actions/checkout@v4

      # Service container não aceita o comando "server" do MinIO: sobe com docker run.
      - name: Iniciar MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=torres -e MINIO_ROOT_PASSWORD=torres-minio \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          timeout 60 sh -c 'until curl -fsS http://localhost:9000/minio/health/live; do sleep 2; done'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build do shared e client do Prisma
        run: pnpm --filter @torres/shared build && pnpm --filter @torres/api db:generate

      - name: Migrations no banco de teste
        run: pnpm --filter @torres/api db:deploy

      - name: Testes (com cobertura)
        run: pnpm --filter @torres/api exec jest --coverage --shard=${{ matrix.parte }}/3

      - name: Publicar cobertura para o Sonar
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-api-${{ matrix.parte }}
          path: apps/api/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  testes-web:
    name: Testes do web (parte ${{ matrix.parte }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build do shared
        run: pnpm --filter @torres/shared build

      - name: Testes (com cobertura)
        run: pnpm --filter @torres/web exec vitest run --coverage --shard=${{ matrix.parte }}/3

      - name: Publicar cobertura para o Sonar
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-web-${{ matrix.parte }}
          path: apps/web/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  # Layout no celular (issue #161): Chromium real em 360 e 414 px, com a API simulada por rota.
  testes-layout:
    name: Layout no celular (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build do shared
        run: pnpm --filter @torres/shared build

      - name: Instalar o Chromium
        run: pnpm --filter @torres/web exec playwright install --with-deps chromium

      - name: Testes de layout
        run: pnpm --filter @torres/web test:layout

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-celular-resultados
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    needs: [verificacao, testes-api, testes-web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PRs de forks não recebem o SONAR_TOKEN.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo para o Sonar identificar o código novo.
          fetch-depth: 0

      # Um lcov por job em cobertura/<artifact>/lcov.info (caminhos no sonar-project.properties).
      - name: Baixar cobertura
        uses: actions/download-artifact@v4
        with:
          pattern: cobertura-*
          path: cobertura

      - name: Análise e Quality Gate
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Falha o check quando o Quality Gate reprova.
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
