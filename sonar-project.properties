sonar.organization=s-marques
sonar.projectKey=s-marques_torresmedical
sonar.projectName=torresmedical

# Código-fonte e testes. Os primitivos do shadcn/ui (components/ui) são gerados pelo CLI
# e ficam fora da análise, como o client gerado do Prisma.
sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.tests=apps/api/src,apps/api/test,apps/web/src,packages/shared/src
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx,apps/web/src/test/**
sonar.exclusions=docs/**,**/dist/**,**/coverage/**,**/node_modules/**,**/prisma/migrations/**,apps/api/src/generated/**,**/*.generated.*,apps/web/src/components/ui/**

# Fora da cobertura: bootstrap da aplicação
sonar.coverage.exclusions=apps/api/src/main.ts,apps/web/src/main.tsx

# Cobertura (lcov) gerada por Jest (api) e Vitest (web, shared). No CI os testes da api e do web
# rodam em partes paralelas (matriz "parte" em .github/workflows/ci.yml); o job do Sonar baixa um
# lcov por parte em cobertura/<artifact>/ e o Sonar soma a cobertura dos arquivos repetidos.
# Ao mudar o número de partes no ci.yml, atualize esta lista.
sonar.javascript.lcov.reportPaths=cobertura/cobertura-shared/lcov.info,cobertura/cobertura-api-1/lcov.info,cobertura/cobertura-api-2/lcov.info,cobertura/cobertura-api-3/lcov.info,cobertura/cobertura-web-1/lcov.info,cobertura/cobertura-web-2/lcov.info,cobertura/cobertura-web-3/lcov.info

sonar.sourceEncoding=UTF-8
